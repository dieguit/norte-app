name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: turbo-build-${{ runner.os }}-
      - run: pnpm turbo run build
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-lint-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: turbo-lint-${{ runner.os }}-
      # lint only depends on ^lint, but web tsc and typed API eslint resolve @repo/* types from packages/*/dist.
      - run: pnpm turbo run build --filter='./packages/*'
      - run: pnpm turbo run lint
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-lint-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  check-types:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-check-types-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-check-types-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: turbo-check-types-${{ runner.os }}-
      - run: pnpm turbo run check-types
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-check-types-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  unit:
    needs: [build, lint, check-types]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-unit-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ github.run_id }}-
            turbo-build-${{ runner.os }}-
      # Read-only: specs use the real clock and web Vitest loads gitignored .env files, neither is in the Turbo hash.
      - run: pnpm turbo run test --cache=local:r

  e2e:
    needs: [build, lint, check-types]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # All E2E runs share one Clerk test user, so they are globally serialized; a running E2E is never cancelled.
    concurrency:
      group: e2e-clerk-shared-user
      cancel-in-progress: false
    steps:
      - name: Require E2E secrets
        env:
          E2E_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          E2E_CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_CLERK_ISSUER_URL: ${{ secrets.E2E_CLERK_ISSUER_URL }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        run: |
          missing=0
          for name in E2E_CLERK_PUBLISHABLE_KEY E2E_CLERK_SECRET_KEY E2E_CLERK_ISSUER_URL E2E_CLERK_USER_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing or empty"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ github.run_id }}-
            turbo-build-${{ runner.os }}-
      - run: pnpm turbo run build --filter='./packages/*' --cache=local:r
      - run: docker compose up -d --wait postgres-test
      # Rollback suites only run against a migrated database named norte_test; Clerk placeholders come from test/setup-env.ts.
      - name: API integration tests
        env:
          DATABASE_URL: postgres://norte:norte@localhost:5434/norte_test
        run: |
          mkdir -p /tmp/opencode
          pnpm --filter @repo/api db:migrate
          pnpm --filter @repo/api test:e2e
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          source: .
          files: docker-compose.yml
          targets: api-e2e,web-e2e
          load: true
          set: |
            api-e2e.cache-from=type=gha,scope=e2e-api
            api-e2e.cache-to=type=gha,scope=e2e-api,mode=max,ignore-error=true
            web-e2e.cache-from=type=gha,scope=e2e-web
            web-e2e.cache-to=type=gha,scope=e2e-web,mode=max,ignore-error=true
      - name: Write apps/e2e/.env.test
        env:
          E2E_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          E2E_CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_CLERK_ISSUER_URL: ${{ secrets.E2E_CLERK_ISSUER_URL }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        run: |
          umask 077
          {
            printf 'VITE_CLERK_PUBLISHABLE_KEY=%s\n' "$E2E_CLERK_PUBLISHABLE_KEY"
            printf 'CLERK_SECRET_KEY=%s\n' "$E2E_CLERK_SECRET_KEY"
            printf 'CLERK_ISSUER_URL=%s\n' "$E2E_CLERK_ISSUER_URL"
            printf 'E2E_CLERK_USER_EMAIL=%s\n' "$E2E_CLERK_USER_EMAIL"
          } > apps/e2e/.env.test
      - run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-attempt-${{ github.run_attempt }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: |
          docker compose --profile e2e down -v --remove-orphans || true
          rm -rf apps/e2e/.env.test apps/e2e/.auth

  ci-required:
    if: always()
    needs: [build, lint, check-types, unit, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
